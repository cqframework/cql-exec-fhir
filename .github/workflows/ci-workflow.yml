name: CI Checks

on: [push, pull_request]

jobs:
  lint:
    name: Check audit, lint, and prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npm audit
      - run: npm run lint
      - run: npm run prettier
        env:
          CI: true

  test:
    name: Test cql-execution ${{ matrix.cql_execution }} with node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't cancel other jobs if one combination fails
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [ '14', '16', '18' ]
        cql_execution: [ '^3.0.0', '^4.0.0-0' ]

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm install --no-save --package-lock=false cql-execution@${{ matrix.cql_execution }}
      - run: npm test
